[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aiomapit"
version = "0.2.0"
description = "Async Python client for the Mapit API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mapit IoT S.L." }]
requires-python = ">=3.12"
dependencies = ["aiohttp>=3.9"]
keywords = ["mapit", "api", "asyncio", "aiohttp", "home-assistant"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/mapit-iot/aiomapit"
Issues = "https://github.com/mapit-iot/aiomapit/issues"
Changelog = "https://github.com/mapit-iot/aiomapit/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  # aioresponses 0.7.9 breaks on aiohttp 3.14 (pnuckowski/aioresponses#288); lift when fixed.
  "aiohttp<3.14",
  "aioresponses>=0.7.6",
  "mypy>=1.11",
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aiomapit"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov=aiomapit --cov-report=term-missing --cov-fail-under=95"
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["src", "tests"]
mypy_path = "src"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC", "PT"]
